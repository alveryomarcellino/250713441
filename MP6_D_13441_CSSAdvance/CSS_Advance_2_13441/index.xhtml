<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Kegiatan Kampus</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <div class="container">
        <div class="header-banner">
            <h1>Formulir Pendaftaran Kegiatan</h1>
            <p class="subtitle">Silakan isi formulir registrasi acara kampus dengan data yang akurat.</p>
        </div>
        
        <form action="" method="post" enctype="multipart/form-data">
            <h2>Data Pendaftar</h2>
            
            <div class="form-section">
                <label for="namalengkap"><strong>Nama Lengkap</strong></label>
                <input type="text" id="namalengkap" name="namalengkap" placeholder="Masukkan nama lengkap" />
            </div>

            <div class="form-section">
                <label for="nim"><strong>NIM (Nomor Induk Mahasiswa)</strong></label>
                <input type="text" id="nim" name="nim" placeholder="Contoh: 250713441" />
            </div>

            <div class="form-section">
                <label for="prodi"><strong>Program Studi</strong></label>
                <select id="prodi" name="prodi">
                    <option value="">-- Pilih Program Studi --</option>
                    <option>Informatika</option>
                    <option>Sistem Informasi</option>
                    <option>Teknik Industri</option>
                </select>
            </div>

            <div class="form-section">
                <strong>Jenis Kelamin</strong>
                <div class="radio-group-inline">
                    <label><input type="radio" id="lakilaki" name="gender" value="Laki-laki" /> Laki-laki</label>
                    <label><input type="radio" id="perempuan" name="gender" value="Perempuan" /> Perempuan</label>
                </div>
            </div>

            <h2>Pilihan Kegiatan &amp; Minat</h2>

            <div class="form-section">
                <strong>Jenis Kegiatan</strong>
                <div class="radio-group-inline">
                    <label><input type="radio" id="seminar" name="kegiatan" value="Seminar" /> Seminar</label>
                    <label><input type="radio" id="pelatihan" name="kegiatan" value="Pelatihan" /> Pelatihan</label>
                    <label><input type="radio" id="diskusi" name="kegiatan" value="Diskusi" /> Diskusi</label>
                </div>
            </div>

            <div class="form-section">
                <strong>Bidang Minat</strong>
                <div class="checkbox-group-inline">
                    <label><input type="checkbox" id="teknologi" name="minat" value="Teknologi" /> Teknologi</label>
                    <label><input type="checkbox" id="organisasi" name="minat" value="Organisasi" /> Organisasi</label>
                    <label><input type="checkbox" id="karier" name="minat" value="Karier" /> Karier</label>
                </div>
            </div>

            <div class="form-section">
                <label for="waktu"><strong>Waktu Pelaksanaan</strong></label>
                <select id="waktu" name="waktu">
                    <option value="">-- Pilih Sesi Waktu --</option>
                    <option>Pagi</option>
                    <option>Siang</option>
                    <option>Sore</option>
                </select>
            </div>

            <h2>Kelengkapan Pendaftaran</h2>

            <div class="form-section">
                <label for="harapan"><strong>Harapan Mengikuti Kegiatan</strong></label>
                <textarea id="harapan" name="harapan" rows="4" placeholder="Tuliskan harapan atau target setelah mengikuti kegiatan ini..."></textarea>
            </div>

            <div class="form-section">
                <label for="bukti"><strong>Unggah Bukti Pembayaran / Dokumen</strong></label>
                <input type="file" id="bukti" name="bukti" />
            </div>

            <div class="text-center">
                <input type="submit" name="kirim" value="Kirim Formulir" class="btn-submit" />
            </div>
        </form>
    </div>
</body>
</html>
